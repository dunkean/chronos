[package]
name = "chronos-export-map"
version = "0.1.0"
edition = "2024"
publish = false
description = "One-off fixture preparation: Neural Earth/Orogen graph fields -> regional rasters -> Magna Urbis place/roads"

# Standalone: never a member of the Chronos workspace, and only built for data preparation.
[workspace]

[dependencies]
magna-urbis-core = { path = "../../../city_generator/rust/crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
