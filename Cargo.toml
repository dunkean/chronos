[workspace]
resolver = "2"
members = ["crates/chronos-core", "crates/chronos-app"]
# Data-preparation tools (owned by the data agent) are built separately.
exclude = ["tools"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
